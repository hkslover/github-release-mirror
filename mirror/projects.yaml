projects:
  - id: cs2-highlight-tool-v2
    name: cs2-highlight-tool-v2
    enabled: true
    ads:
      version: "1.0"
      items:
        - id: sponsor-88dog-top-banner
          enabled: true
          placement: main_steps_top_banner
          click_url: https://88dog.com/?promotion=CSHL88
          image_url: https://dl.snowblog.xyz/cs2-highlight-tool-v2/static/88dog_top.png
          image_alt: 广告
        # - id: sponsor-88dog-entry-popup
        #   enabled: true
        #   placement: main_entry_popup
        #   click_url: https://88dog.com/?promotion=CSHL88
        #   image_url: https://dl.snowblog.xyz/cs2-highlight-tool-v2/static/88dog_entry.png
        #   image_alt: 广告
        - id: sponsor-88dog-top-banner2
          enabled: true
          placement: main_steps_top_banner
          click_url: https://88dog.com/?promotion=CSHL88
          image_url: https://dl.snowblog.xyz/cs2-highlight-tool-v2/static/88dog_top2.png
          image_alt: 广告
        - id: sponsor-88dog-entry-popup2
          enabled: true
          placement: main_entry_popup
          click_url: https://88dog.com/?promotion=CSHL88
          image_url: https://dl.snowblog.xyz/cs2-highlight-tool-v2/static/88dog_entry2.png
          image_alt: 广告
    dependencies:
      - id: cs2-highlight-tool
        name: cs2-highlight-tool
        repo: hkslover/cs2-highlight-tool
        enabled: true
        include_patterns:
          - "cs2-highlight-tool-v2.exe"
      - id: advancedfx
        name: advancedfx
        repo: advancedfx/advancedfx
        enabled: true
        include_patterns:
          - "^hlae_\\d+(?:_\\d+)*\\.zip$"

      - id: cs2-server-plugin
        name: cs2-server-plugin
        repo: hkslover/cs2-server-plugin
        enabled: true
        include_patterns:
          - "^cs2-server-plugin-v\\d+(?:\\.\\d+)*-windows\\.zip$"
